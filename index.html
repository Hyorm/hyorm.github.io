<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyorim (Miro) Kim | Full-Lifecycle Software Engineer</title>
    <meta name="description" content="Portfolio of Hyorim (Miro) Kim - Full-Lifecycle Software Engineer specializing in C++, Native SDKs, macOS/Windows Systems, and Desktop Applications." />
    <script>
      (function() {
        const stored = localStorage.getItem('theme');
        if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches) || !stored) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#09090b]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
